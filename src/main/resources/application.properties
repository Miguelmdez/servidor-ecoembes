spring.application.name=ecoembes-server
spring.output.ansi.enabled=ALWAYS
# Servidor Ecoembes en el 8080 (el 8081 es de PlasSB y el 8082 de ContSocket)
server.port=8080
server.servlet.context-path=/api/v1

# Persistencia: base de datos H2 en fichero bajo ./db (relativo al directorio de trabajo de la aplicación:
# hay que arrancar siempre desde el mismo directorio para abrir la misma base de datos).
spring.datasource.url=jdbc:h2:file:./db/ecoembesdb
spring.datasource.username=db-user
spring.datasource.password=db-password
spring.sql.init.platform=h2

# Consola H2 en el navegador: http://localhost:8080/api/v1/h2-console
spring.h2.console.enabled=true

# "update" conserva los datos y ajusta el esquema a las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-35.35logger{0}){cyan} : %msg%n
