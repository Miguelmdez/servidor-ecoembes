plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'es.deusto.sd.ecoembes'
version = '1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starter Web for building web applications
    implementation 'org.springframework.boot:spring-boot-starter-web'

	// SpringDoc OpenAPI UI Dependency this is needed to use Swagger annotations
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// Spring Boot Starter Data JPA: persistencia con JPA/Hibernate (paquete dao/ con JpaRepository)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Base de datos H2 en fichero (en los tests se usan bases en memoria)
	runtimeOnly 'com.h2database:h2:2.5.252'

	// Consola web de H2 (en Spring Boot 4 vive en su propio módulo)
	implementation 'org.springframework.boot:spring-boot-h2console'

	// Latest stable Commons Codec; explicitly overrides Spring Boot's managed version.
    implementation 'commons-codec:commons-codec:1.22.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
